name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: ubuntu-latest
    # Guard against a hung step burning the 6-hour default. Lint normally
    # finishes in well under a minute.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        # No authenticated git commands run in this job.
        persist-credentials: false
    # Lint through the build rather than calling Invoke-ScriptAnalyzer directly.
    #
    # The direct call passed -Settings PSGallery and analysed the source tree,
    # while ./build.ps1 -Task Analyze uses this repository's
    # PSScriptAnalyzerSettings.psd1 and analyses the built module. Two rulesets
    # over two different paths, so a local run and this job could disagree
    # without either being wrong. The step this replaced already aimed at
    # matching a local run -- it pinned the analyzer version for exactly that
    # reason -- but pinning the version cannot help while the settings and the
    # path still differ.
    - name: Install dependencies
      shell: pwsh
      run: ./build.ps1 -Bootstrap -Task Init

    - name: Run PSScriptAnalyzer
      shell: pwsh
      run: ./build.ps1 -Task Analyze

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Guard against a hung step burning the 6-hour default. The specific hazard
    # this caught elsewhere in the fleet: BuildHelpers' Invoke-Git calls
    # WaitForExit() before draining stdout, so on Windows a HEAD commit message
    # larger than the 4096-byte pipe buffer deadlocks the build with no output
    # at all. Keep merge-commit messages short.
    #
    # 45 rather than the fleet's 15-minute timeout: this repository's functional
    # tests download real media from a Plex server and ReScene archives (.srr
    # files) from srrdb, so the job runs an order of magnitude longer than the
    # others once Plex is reachable. At 15 minutes it was cancelled mid-run at
    # exactly 15 minutes 3 seconds while the tests were still passing.
    # Still far below the 6-hour default, which is what the guard is for.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    env:
      PAT_SERVER_URI: ${{ secrets.PAT_SERVER_URI }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        # No authenticated git commands run in this job.
        persist-credentials: false
    - name: Free Disk Space (Linux)
      if: runner.os == 'Linux'
      run: |
        # Remove large preinstalled packages to free disk space for video downloads
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h
    - name: Free Disk Space (macOS)
      if: runner.os == 'macOS'
      run: |
        # Remove Xcode simulators and other large items
        sudo rm -rf ~/Library/Developer/CoreSimulator/Devices/* 2>/dev/null || true
        df -h
    - name: Test
      shell: pwsh
      run: ./build.ps1 -Task Test -Bootstrap
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: out/coverage.xml
        fail_ci_if_error: false
        verbose: true
